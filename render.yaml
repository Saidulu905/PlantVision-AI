services:
  # Backend Java Spring Boot Web Service
  - type: web
    name: plantvision-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # Inject database connection variables dynamically from the PostgreSQL database
      - key: DB_HOST
        fromDatabase:
          name: plantvision-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: plantvision-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: plantvision-postgres
          property: databaseName
      - key: DB_USERNAME
        fromDatabase:
          name: plantvision-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: plantvision-postgres
          property: password
      # Build the final JDBC URL for PostgreSQL
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      # CORS: Allow requests from the frontend static site
      - key: CORS_ALLOWED_ORIGINS
        value: https://plantvision-frontend.onrender.com

  # Frontend Vite React Static Site
  - type: web
    name: plantvision-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Rewrite all routes to index.html to support React Router client-side routing
      - source: /*
        destination: /index.html
        type: rewrite
    envVars:
      # Direct frontend requests to the backend public URL
      - key: VITE_API_BASE_URL
        value: https://plantvision-backend.onrender.com

databases:
  - name: plantvision-postgres
    plan: free
    databaseName: plant_store_db
    user: postgres
