services:
  # Backend Java Spring Boot Web Service
  - type: web
    name: plantvision-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      # Use manual dashboard values to connect to the existing PostgreSQL database
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # CORS: Allow requests from the frontend static site
      - key: CORS_ALLOWED_ORIGINS
        value: https://plantvision-frontend.onrender.com

  # Frontend Vite React Static Site
  - type: web
    name: plantvision-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Rewrite all routes to index.html to support React Router client-side routing
      - source: /*
        destination: /index.html
        type: rewrite
    envVars:
      # Direct frontend requests to the backend public URL
      - key: VITE_API_BASE_URL
        value: https://plantvision-backend.onrender.com
